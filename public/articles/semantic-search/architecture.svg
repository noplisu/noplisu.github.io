<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">Bookmantic architecture</title>
  <desc id="archDesc">Indexing goes through Rails and Sidekiq to OpenAI, then stores vectors in Postgres. Search embeds the query once. Similar books reuse the stored vector.</desc>
  <defs>
    <linearGradient id="archAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8b86d"/>
      <stop offset="1" stop-color="#c45c6e"/>
    </linearGradient>
    <marker id="archArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#e8b86d"/>
    </marker>
  </defs>
  <rect width="1120" height="620" rx="24" fill="#1a1224"/>
  <rect x="1" y="1" width="1118" height="618" rx="23" fill="none" stroke="#e8b86d" stroke-opacity="0.28"/>

  <text x="48" y="52" fill="#e8b86d" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="2.4">INDEXING</text>
  <text x="48" y="82" fill="#f5efe6" font-family="Georgia, 'Times New Roman', serif" font-size="22">Embeddings never block the request</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#f5efe6">
    <rect x="48" y="108" width="168" height="72" rx="14" fill="#2a1c36" stroke="#e8b86d" stroke-opacity="0.35"/>
    <text x="132" y="140" text-anchor="middle" font-size="12" fill="#b9a99a">HTTP</text>
    <text x="132" y="160" text-anchor="middle" font-weight="600">Create book</text>

    <line x1="216" y1="144" x2="258" y2="144" stroke="#e8b86d" stroke-width="2" marker-end="url(#archArrow)"/>

    <rect x="268" y="108" width="168" height="72" rx="14" fill="#2a1c36" stroke="#e8b86d" stroke-opacity="0.35"/>
    <text x="352" y="140" text-anchor="middle" font-size="12" fill="#b9a99a">Rails 8</text>
    <text x="352" y="160" text-anchor="middle" font-weight="600">enqueue job</text>

    <line x1="436" y1="144" x2="478" y2="144" stroke="#e8b86d" stroke-width="2" marker-end="url(#archArrow)"/>

    <rect x="488" y="108" width="168" height="72" rx="14" fill="#2a1c36" stroke="#e8b86d" stroke-opacity="0.35"/>
    <text x="572" y="140" text-anchor="middle" font-size="12" fill="#b9a99a">Sidekiq</text>
    <text x="572" y="160" text-anchor="middle" font-weight="600">embed title+blurb</text>

    <line x1="656" y1="144" x2="698" y2="144" stroke="#e8b86d" stroke-width="2" marker-end="url(#archArrow)"/>

    <rect x="708" y="108" width="168" height="72" rx="14" fill="#2a1c36" stroke="#e8b86d" stroke-opacity="0.35"/>
    <text x="792" y="140" text-anchor="middle" font-size="12" fill="#b9a99a">OpenAI</text>
    <text x="792" y="160" text-anchor="middle" font-weight="600">1536-d vector</text>

    <line x1="876" y1="144" x2="918" y2="144" stroke="#e8b86d" stroke-width="2" marker-end="url(#archArrow)"/>

    <rect x="928" y="108" width="144" height="72" rx="14" fill="#2a1c36" stroke="url(#archAccent)" stroke-width="1.5"/>
    <text x="1000" y="140" text-anchor="middle" font-size="12" fill="#b9a99a">Postgres</text>
    <text x="1000" y="160" text-anchor="middle" font-weight="600">pgvector</text>
  </g>

  <line x1="48" y1="214" x2="1072" y2="214" stroke="#e8b86d" stroke-opacity="0.18"/>

  <text x="48" y="256" fill="#e8b86d" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="2.4">SEARCH</text>
  <text x="48" y="286" fill="#f5efe6" font-family="Georgia, 'Times New Roman', serif" font-size="22">One query vector, then neighbors</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#f5efe6">
    <rect x="48" y="312" width="220" height="80" rx="14" fill="#2a1c36" stroke="#e8b86d" stroke-opacity="0.35"/>
    <text x="158" y="346" text-anchor="middle" font-size="12" fill="#b9a99a">GET /books/search</text>
    <text x="158" y="368" text-anchor="middle" font-weight="600">'hopeful sci-fi'</text>

    <line x1="268" y1="352" x2="310" y2="352" stroke="#e8b86d" stroke-width="2" marker-end="url(#archArrow)"/>

    <rect x="320" y="312" width="220" height="80" rx="14" fill="#2a1c36" stroke="#e8b86d" stroke-opacity="0.35"/>
    <text x="430" y="346" text-anchor="middle" font-size="12" fill="#b9a99a">EmbeddingService</text>
    <text x="430" y="368" text-anchor="middle" font-weight="600">OpenAI, once</text>

    <line x1="540" y1="352" x2="582" y2="352" stroke="#e8b86d" stroke-width="2" marker-end="url(#archArrow)"/>

    <rect x="592" y="312" width="220" height="80" rx="14" fill="#2a1c36" stroke="#e8b86d" stroke-opacity="0.35"/>
    <text x="702" y="346" text-anchor="middle" font-size="12" fill="#b9a99a">neighbor + HNSW</text>
    <text x="702" y="368" text-anchor="middle" font-weight="600">cosine distance</text>

    <line x1="812" y1="352" x2="854" y2="352" stroke="#e8b86d" stroke-width="2" marker-end="url(#archArrow)"/>

    <rect x="864" y="312" width="208" height="80" rx="14" fill="#2a1c36" stroke="url(#archAccent)" stroke-width="1.5"/>
    <text x="968" y="346" text-anchor="middle" font-size="12" fill="#b9a99a">Response</text>
    <text x="968" y="368" text-anchor="middle" font-weight="600">top 5 books</text>
  </g>

  <text x="48" y="444" fill="#e8b86d" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="2.4">SIMILAR BOOKS</text>
  <text x="48" y="474" fill="#f5efe6" font-family="Georgia, 'Times New Roman', serif" font-size="22">No extra OpenAI call</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#f5efe6">
    <rect x="48" y="500" width="300" height="72" rx="14" fill="#2a1c36" stroke="#e8b86d" stroke-opacity="0.35"/>
    <text x="198" y="532" text-anchor="middle" font-size="12" fill="#b9a99a">GET /books/:id/similar</text>
    <text x="198" y="552" text-anchor="middle" font-weight="600">reuse books.embedding</text>

    <line x1="348" y1="536" x2="400" y2="536" stroke="#e8b86d" stroke-width="2" marker-end="url(#archArrow)"/>

    <rect x="410" y="500" width="300" height="72" rx="14" fill="#2a1c36" stroke="#e8b86d" stroke-opacity="0.35"/>
    <text x="560" y="532" text-anchor="middle" font-size="12" fill="#b9a99a">same HNSW index</text>
    <text x="560" y="552" text-anchor="middle" font-weight="600">exclude self, limit 5</text>

    <line x1="710" y1="536" x2="762" y2="536" stroke="#e8b86d" stroke-width="2" marker-end="url(#archArrow)"/>

    <rect x="772" y="500" width="300" height="72" rx="14" fill="#2a1c36" stroke="url(#archAccent)" stroke-width="1.5"/>
    <text x="922" y="532" text-anchor="middle" font-size="12" fill="#b9a99a">Shelf, not a random sample</text>
    <text x="922" y="552" text-anchor="middle" font-weight="600">cheap and fast</text>
  </g>
</svg>
